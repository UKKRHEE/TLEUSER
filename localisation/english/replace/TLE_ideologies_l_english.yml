 kitaism:0 "순정사회주의"
 kitaism_desc:0 "기타 잇키가 주장한 순정사회주의는 기존 신정일치의 모습을 보이는 천황제에 반대하고, 단일한 강력한 지도자에 의해 사회주의의 이상이 강제되는 국가를 만드려고 합니다."
 conservatism:0 "보수주의"
 conservatism_desc:0 "\n\n£GFX_conservatism_texticon\n\n\n\n\n\n§8보수주의§!는 사회 질서와 전통, 가족, 종교와 같은 오래된 가치들을 존중하며, 급진적 변화보다는 점진적 개혁을 추구하고 질서의 안정과 지속성을 강조합니다.\n\n이들은 개인의 자유를 인정하되, 공동체의 안녕과 도덕적 기반을 보호하기 위해 일정한 제약이 필요하다고 봅니다. 사회적 혼란을 막기 위한 법과 질서 유지, 강한 국가 권력의 중요성을 강조하기도 합니다. 경제적으로는 자유시장 원칙을 지지하나, 사회 전반의 안정을 위해 정부의 제한적 개입도 용인하는 경우가 많습니다. 급진주의와 대립하며, 사회적·문화적 전통의 보존에도 힘씁니다."
 liberalism:0 "자유주의"
 liberalism_desc:0 "\n\n£GFX_liberalism_texticon\n\n\n\n\n\n§8자유주의§!는 개인의 자유와 권리를 중심 가치로 내세우는 정치·철학 사상으로, 17~18세기 유럽 계몽주의 시기부터 발전했습니다. 자연권, 법치주의, 권력 분립의 중요성을 강조하며 현대 민주주의의 기초를 마련했습니다.\n\n이들은 시민의 표현, 종교, 집회의 자유를 보장하고, 국가 권력의 제한과 견제를 주장합니다. 경제적으로는 자유 시장을 통해 개인의 경제 활동을 장려하며, 국가 개입은 최소한으로 줄이는 것이 원칙입니다. 그러나 일부 자유주의자들은 사회적 약자를 위한 최소한의 복지 정책도 수용합니다."
 socialism:0 "사회주의"
 socialism_desc:0 "\n\n£GFX_socialism_texticon\n\n\n\n\n\n§8사회주의§!는 생산 수단의 사회적 또는 공공 소유를 통해 경제적 불평등을 줄이고, 사회 구성원 모두의 복지를 증진하려는 사상입니다. 공산주의와 달리 완전한 계급 폐지는 추구하지 않거나, 자본주의의 일부 요소를 허용하면서 점진적 개혁을 강조합니다.\n\n산업혁명으로 인해 노동자들의 열악한 상황이 심화되자, 사회주의는 부의 재분배와 노동자의 권익 보호를 위한 정치적 운동으로 성장했습니다. 이들은 민주주의 체제와 법 아래에서 노동조합 활동, 복지 국가 건설, 공공 서비스 확대 등을 통한 사회적 평등을 추구합니다."
 marxism:0 "마르크스주의"
 marxism_desc:0 "\n\n£GFX_communism_texticon\n\n\n\n\n\n§8공산주의§!는 혁명을 통해 자본주의 사회의 계급 불평등을 철폐하고, 생산 수단을 공동으로 소유하여 계급 없는 평등한 사회를 실현하려는 정치·경제 이념입니다. 이 사상은 카를 마르크스와 프리드리히 엥겔스에 의해 체계화되었으며, 블라디미르 레닌에 의해 확산되었습니다.\n\n공산주의 체제에서는 모든 자원이 공산당 또는 국가에 의해 통제되며, 사적 소유는 철폐됩니다. 이런 권위주의적이고 중앙집권적인 정책은 급속한 산업 발전과 자원의 공정하고 효율적인 배분을 꾀하기 위함이지만, 이 때문에 대부분의 경우 개인의 자유와 선택권은 극도로 제한됩니다."
 leninism:0 "레닌주의"
 leninism_desc:0 "\n\n£GFX_communism_texticon\n\n\n\n\n\n§8공산주의§!는 혁명을 통해 자본주의 사회의 계급 불평등을 철폐하고, 생산 수단을 공동으로 소유하여 계급 없는 평등한 사회를 실현하려는 정치·경제 이념입니다. 이 사상은 카를 마르크스와 프리드리히 엥겔스에 의해 체계화되었으며, 블라디미르 레닌에 의해 확산되었습니다.\n\n공산주의 체제에서는 모든 자원이 공산당 또는 국가에 의해 통제되며, 사적 소유는 철폐됩니다. 이런 권위주의적이고 중앙집권적인 정책은 급속한 산업 발전과 자원의 공정하고 효율적인 배분을 꾀하기 위함이지만, 이 때문에 대부분의 경우 개인의 자유와 선택권은 극도로 제한됩니다."
 stalinism:0 "스탈린주의"
 stalinism_desc:1 "\n\n£GFX_communism_texticon\n\n\n\n\n\n§8공산주의§!는 혁명을 통해 자본주의 사회의 계급 불평등을 철폐하고, 생산 수단을 공동으로 소유하여 계급 없는 평등한 사회를 실현하려는 정치·경제 이념입니다. 이 사상은 카를 마르크스와 프리드리히 엥겔스에 의해 체계화되었으며, 블라디미르 레닌에 의해 확산되었습니다.\n\n공산주의 체제에서는 모든 자원이 공산당 또는 국가에 의해 통제되며, 사적 소유는 철폐됩니다. 이런 권위주의적이고 중앙집권적인 정책은 급속한 산업 발전과 자원의 공정하고 효율적인 배분을 꾀하기 위함이지만, 이 때문에 대부분의 경우 개인의 자유와 선택권은 극도로 제한됩니다."
 nazism:0 "나치즘"
 nazism_desc:0 "\n\n£GFX_ultranationalism_texticon\n\n\n\n\n\n§8국수주의§!는 20세기 초에 들어 유행하기 시작한, 국가의 권위를 최고로 두는 민족주의적이고 권위주의적인 이념입니다. 개인보다는 국가와 민족의 단결을 강조하며, 전체 사회가 하나의 유기체처럼 움직여야 한다고 봅니다. 이는 다른 나라나 민족을 배척하는 극단적인 태도나 경향을 불러일으키며, 애국심을 가장해 개인의 이익과 국가의 이익이 충돌할 때 국가의 이익만을 우선 선택하도록 만듭니다.\n\n이들은 대부분의 경우 우상화된 지도자를 중심으로 한 독재를 지향하고, 정치적 반대파에 대한 무자비한 탄압, 언론과 집회의 자유 제한, 군사력 강화 등을 특징으로 합니다. 사회 질서와 국가의 위신을 세우기 위해 폭력과 선전이 적극 활용되었고, 국가의 확장을 위한 전쟁을 정당화합니다.\n\n독일의 §8국가사회주의§!, 이탈리아의 §8파시즘§!, 한국의 §8군국주의§!를 대표적인 예로 들 수 있습니다."
