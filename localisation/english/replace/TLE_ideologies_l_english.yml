 korean_democracy:0 "외견적 입헌정"
 korean_democracy_desc:0 "\n\n£GFX_koreanpolitics_texticon\n\n\n\n\n\n대한제국에서 군주는 통치자이며 강대한 지배권을 가지고 실제로 이를 행사합니다. 고종과 순종의 현대화를 통해 외견상으로는 삼권분립체제를 취하고 있으나, 군주는 대권에 의한 군대의 통수권 및 관리임명권을 가집니다. \n\n국민들은 4년에 한번 민의원을 선출하지만, 이는 군주가 현대화된 실정에 맞게 외견상 민주주의를 표방하는 수단일 뿐, 행정부 수반인 총리는 민의원들에 의해 선출되고, 참의원의 수락과 최종적으로 황제의 재가를 통해 결정됩니다. \n\n의회는 양원제입니다. 하원인 민의원은 한국인들의 손으로 선출되나, 상원인 참의원은 군주의 임명 및 전직 참의원의 추천으로 봉작됩니다. 그렇기에 이들은 통치권의 주체가 아니라 자문의 역할을 할 뿐입니다. \n\n법부는 사실상 대한제국 황제의 입김이 가장 강한 곳입니다. 형조의 소관 업무를 계승하였기에 이들의 수반은 황제가 친택하며, 일반적인 하급 업무가 아닌 정치적 중대사안에 관련된 법적 조치는 결국 황제의 손에 달려있습니다.\n\n그리하여 대한제국은 외견상의 입헌정을 띌 뿐, 실질적으로 전제정이라 할 수 있을만큼의 권력을 가진 군주가 존재하고 있습니다."
 korean_oligarchism:0 "과두적 입헌정"
 korean_oligarchism_desc:0 "\n\n£GFX_koreanpolitics_texticon\n\n\n\n\n\n대한제국은 명목상 입헌군주정이지만 실질적으로 전제군주정에 가깝습니다. 그렇기에 의회와 내각은 황제의 의사가 개입되는 순간 병풍으로 전락합니다. 하지만 황제가 개입하지 않는 시점에서는 소수의 정치인들이 정치권력을 독점합니다.\n\n대한제국의 모든 권력은 소수의 권력층에게 귀속되어 있습니다. 하원인 민의원에서 국민의 의사를 반영하지만, 결국 이 또한 정계와 야합한 언론과 재계의 손에서 놀아나기 쉽습니다. \n\n그리하여 대한제국의 정치 형태는 국민에게 주권이 존재하는 형태가 아닌 군주에게 주권이 존재하는 형태를 충실하게 반영하고, 또 그에서 나오는 정치적 구조를 반영하고 있습니다. "
 korean_despotism:0 "전제정"
 korean_despotism_desc:0 "\n\n£GFX_koreanpolitics_texticon\n\n\n\n\n\n대한제국은 실질적으로 전제군주정 국가입니다. 그렇기에 의회와 내각은 황제의 의사에 따라 좌우되는 병풍으로 전락했습니다.\n\n대한제국의 모든 권력은 한 명의 황제에게 귀속되어 있습니다. 하원인 민의원에서 국민의 의사를 반영하지만, 결국 이 또한 정계와 야합한 언론과 재계의 손에서 놀아나기 쉽습니다.\n\n그리하여 대한제국의 정치 형태는 국민에게 주권이 존재하는 형태가 아닌 군주에게 주권이 존재하는 형태를 충실하게 반영하고, 또 그에서 나오는 정치적 구조를 반영하고 있습니다."
 korean_war_regime:0 "군국주의"
 korean_war_regime_desc:0 "\n\n£GFX_korean_war_regime_texticon\n\n\n\n\n\n§8군국주의§!는 국가의 정치와 사회 전반에서 군사적 가치와 군대 중심의 사고가 절대적으로 우위를 차지하게 되는 사상입니다. 사회 전체가 상시 전시 체제 하에 작동하게 되며, 전쟁은 일시적인 수단이 아니라 국가와 체제 그 자체의 본질으로써 기능합니다. 전쟁과 정복이 국가 발전의 정당한 수단으로 인식되는 만큼 대외 정책은 침략적이고, 개인은 민족과 국가에 대한 절대 복종과 희생, 충성을 요구받습니다.\n\n군국주의 체제 아래 문민통제라는 개념은 허울일 뿐이고, 문민정부는 사실상 군부의 차지가 되었습니다. 이합집산을 거듭하던 의회의 모든 정당들은 기존의 정치적 활동을 멈추고 거국적인 협력을 행하는 중이며, 황제 또한 정부의 전시 정책을 검수하기만 할 뿐 핵심적인 영역에 대하여 반대하거나 수정을 요구하지는 않습니다.\n\n대한제국은 명목상 입헌군주정이지만 실질적으로 전제군주정에 가깝습니다. 그렇기에 군부는 황제의 의사가 개입되는 순간 병풍으로 전락합니다. 하지만 황제가 개입하지 않는 시점에서는 군부와 소수의 정치인들이 정치권력을 독점합니다."
 nkyp_ideology:0 "협동조합주의"
 nkyp_ideology_desc:0 "\n\n£GFX_koreanpolitics_texticon\n\n\n\n\n\n대동아전쟁의 승리 이후 정계를 장악한 신한청년당은 일당 체제를 성립시키는 데 성공하였습니다. 이는 상호 간의 협력을 강조하여 제국 공통의 이해관계를 도출 가능케 하는 코퍼러티즘(Corporatism) 또는 §8협동조합주의§!를 바탕으로 하는 것입니다.\n\n대한제국은 명목상 입헌군주정이지만 실질적으로 전제군주정에 가깝습니다. 그렇기에 의회와 내각은 황제의 의사가 개입되는 순간 병풍으로 전락합니다. 하지만 황제가 개입하지 않는 시점에서는 소수의 정치인들이 정치권력을 독점합니다.\n\n대한제국의 모든 권력은 소수의 권력층에게 귀속되어 있습니다. 하원인 민의원에서 국민의 의사를 반영하지만, 결국 이 또한 정계와 야합한 언론과 재계의 손에서 놀아나기 쉽습니다. \n\n그리하여 대한제국의 정치 형태는 국민에게 주권이 존재하는 형태가 아닌 군주에게 주권이 존재하는 형태를 충실하게 반영하고, 또 그에서 나오는 정치적 구조를 반영하고 있습니다."
 daegongism:0 "대공주의"
 daegongism_desc:0 "'\n\n£GFX_koreanpolitics_texticon\n\n\n\n\n\n큰 공공의 원칙'을 의미하는 §8대공주의§!는 사적인 이해나 파벌의 이득 관계를 뛰어넘어 민족과 사회 전체의 이익을 최우선으로 삼습니다. 다만 이는 국가주의로 귀결되는 전체주의가 아니라 공동선, 즉 다방면에 걸친 평등주의에 기초하며 이를 추구함이 곧 사회 전체의 이익과 부를 늘리리라고 확신합니다.\n\n또한 대공주의는 이를 제창한 도산 안창호가 속한 한민족에게만 제한되지 않습니다. 궁극적으로 개별 민족 간, 개별 국가 간의 평등을 실현하고 전 세계의 인류의 평화와 공영을 지향하는 보편적인 선을 추구합니다."
 monarchism:0 "군주정"
 monarchism_desc:0 "\n\n£GFX_monarchism_texticon\n\n\n\n\n\n§8군주정§!은 국가의 통치권이 한 명의 군주에게 집중된 정치 체제로, 보통 왕이나 황제가 권력자로 기능합니다. 군주의 권한은 세습을 통해 이전되며, 정통성은 신성한 권리나 전통에 기반하는 경우가 많습니다. 이는 보통 강한 전통의식과 결합되어 있으며, 군주의 존재는 국가 정체성의 핵심 요소로 간주되기도 합니다.\n\n시간이 지나면서 일부 군주정은 입헌군주제로 변화하여, 군주의 권한은 상징적이며, 실질적으로는 의회나 정부에 의해 지도되고 있습니다. 그러나 전제군주정의 경우 일반적인 전제정과 유사한 성격을 띨 수 있으며, 민중의 자유와 권리는 크게 제한될 수 있습니다."
 despotism:0 "전제정"
 despotism_desc:0 "\n\n£GFX_despotism_texticon\n\n\n\n\n\n§8전제정§!은 권력이 한 개인에게 집중되어 있는 정치 체제로, 국민의 자유와 정치적 권리는 철저히 제한됩니다. 이 체제에서 통치자는 법이나 제도보다 자신의 의지에 따라 국가를 운영하며, 반대 의견이나 다른 이념은 용납되지 않거나 철저히 배제됩니다. 정권에 저항하는 세력은 흔히 강압적인 수단을 통해 억압당합니다.\n\n선거가 열리는 경우도 있지만, 이는 대개 형식적인 절차에 불과하며, 진행 방식이 제한되거나 결과가 조작되는 경우가 많습니다. 실질적인 권력은 여전히 개인의 손에 남아 있고, 체제는 이들이 권력을 유지할 수 있도록 설계되어 있습니다.\n\n전제 체제는 내부 통제뿐 아니라 외부에 대한 영향력 확대도 추구하는 경향이 있습니다. 이를 위해 대규모 군사력을 유지하기도 하며, 군대와 경찰은 정권 보호를 위한 핵심 수단으로 기능합니다. 민족주의 또한 이런 정권에서 자주 활용되지만, 파시즘처럼 그 자체가 중심은 아니며, 주로 정치적인 구실로 사용됩니다."
 oligarchism:0 "과두정"
 oligarchism_desc:0 "\n\n£GFX_oligarchy_texticon\n\n\n\n\n\n§8과두정§!은 권력이 소수의 사람들, 즉 제한된 집단에 의해 독점되는 정치 체제입니다. 이 집단은 종종 귀족, 부유한 경제 엘리트, 군부, 특정 정당의 고위층 등으로 구성되며, 일반 대중은 정치 결정 과정에서 배제됩니다. 표면적으로는 제도와 법률이 존재할 수 있으나, 실제로는 소수가 자신들의 이익을 중심으로 국가를 운영합니다.\n\n과두 체제에서는 정치적 다원주의가 제한되며, 다양한 의견이 존재하더라도 실질적인 영향력을 행사하지 못합니다. 선거가 있을 경우에도 제한적이거나 조작되는 경우가 많습니다. 이러한 체제에서는 권력을 나눈 소수 간의 내부 경쟁이나 갈등이 발생할 수 있으나, 외부로부터의 도전에는 단호하게 대응하는 경우가 많습니다. 국민은 제도의 수혜자라기보다 통치 대상에 가까우며, 국가 운영의 방향은 철저히 지배층의 이해관계를 중심으로 결정됩니다."
 centrism:1 "과두정"
 centrism_desc:1 "\n\n£GFX_oligarchy_texticon\n\n\n\n\n\n§8과두정§!은 권력이 소수의 사람들, 즉 제한된 집단에 의해 독점되는 정치 체제입니다. 이 집단은 종종 귀족, 부유한 경제 엘리트, 군부, 특정 정당의 고위층 등으로 구성되며, 일반 대중은 정치 결정 과정에서 배제됩니다. 표면적으로는 제도와 법률이 존재할 수 있으나, 실제로는 소수가 자신들의 이익을 중심으로 국가를 운영합니다.\n\n과두 체제에서는 정치적 다원주의가 제한되며, 다양한 의견이 존재하더라도 실질적인 영향력을 행사하지 못합니다. 선거가 있을 경우에도 제한적이거나 조작되는 경우가 많습니다. 이러한 체제에서는 권력을 나눈 소수 간의 내부 경쟁이나 갈등이 발생할 수 있으나, 외부로부터의 도전에는 단호하게 대응하는 경우가 많습니다. 국민은 제도의 수혜자라기보다 통치 대상에 가까우며, 국가 운영의 방향은 철저히 지배층의 이해관계를 중심으로 결정됩니다."
 anarchism:0 "아나키즘"
 anarchism_desc:0 "\n\n£GFX_anarchism_texticon\n\n\n\n\n\n§8아나키즘§!은 권위 자체를 그 형태에 상관 없이 거부하는 사상으로, 주로 국가 및 정부의 철폐와 공동체 자치 실현을 주장합니다."