 fascism_ideology_desc:0 "\n\n£GFX_ultranationalism_texticon\n\n\n\n\n\n§8국수주의§!는 20세기 초에 들어 유행하기 시작한, 국가의 권위를 최고로 두는 민족주의적이고 권위주의적인 이념입니다. 개인보다는 국가와 민족의 단결을 강조하며, 전체 사회가 하나의 유기체처럼 움직여야 한다고 봅니다. 이는 다른 나라나 민족을 배척하는 극단적인 태도나 경향을 불러일으키며, 애국심을 가장해 개인의 이익과 국가의 이익이 충돌할 때 국가의 이익만을 우선 선택하도록 만듭니다.\n\n이들은 대부분의 경우 우상화된 지도자를 중심으로 한 독재를 지향하고, 정치적 반대파에 대한 무자비한 탄압, 언론과 집회의 자유 제한, 군사력 강화 등을 특징으로 합니다. 사회 질서와 국가의 위신을 세우기 위해 폭력과 선전이 적극 활용되었고, 국가의 확장을 위한 전쟁을 정당화합니다.\n\n독일의 §8국가사회주의§!, 이탈리아의 §8파시즘§!, 한국의 §8군국주의§!를 대표적인 예로 들 수 있습니다."
 ultranationalism:0 "군국주의"
 ultranationalism_desc:0 "\n\n£GFX_korean_war_regime_texticon\n\n\n\n\n\n§8군국주의§!는 국가의 정치와 사회 전반에서 군사적 가치와 군대 중심의 사고가 절대적으로 우위를 차지하게 되는 사상입니다. 사회 전체가 상시 전시 체제 하에 작동하게 되며, 전쟁은 일시적인 수단이 아니라 국가와 체제 그 자체의 본질으로써 기능합니다. 전쟁과 정복이 국가 발전의 정당한 수단으로 인식되는 만큼 대외 정책은 침략적이고, 개인은 민족과 국가에 대한 절대 복종과 희생, 충성을 요구받습니다."
 falangism:0 "팔랑헤주의"
 falangism_desc:0 "\n\n£GFX_ultranationalism_texticon\n\n\n\n\n\n§8국수주의§!는 20세기 초에 들어 유행하기 시작한, 국가의 권위를 최고로 두는 민족주의적이고 권위주의적인 이념입니다. 개인보다는 국가와 민족의 단결을 강조하며, 전체 사회가 하나의 유기체처럼 움직여야 한다고 봅니다. 이는 다른 나라나 민족을 배척하는 극단적인 태도나 경향을 불러일으키며, 애국심을 가장해 개인의 이익과 국가의 이익이 충돌할 때 국가의 이익만을 우선 선택하도록 만듭니다.\n\n이들은 대부분의 경우 우상화된 지도자를 중심으로 한 독재를 지향하고, 정치적 반대파에 대한 무자비한 탄압, 언론과 집회의 자유 제한, 군사력 강화 등을 특징으로 합니다. 사회 질서와 국가의 위신을 세우기 위해 폭력과 선전이 적극 활용되었고, 국가의 확장을 위한 전쟁을 정당화합니다.\n\n독일의 §8국가사회주의§!, 이탈리아의 §8파시즘§!, 한국의 §8군국주의§!를 대표적인 예로 들 수 있습니다."
 rexism:0 "렉시즘"
 rexism_desc:0 "\n\n£GFX_ultranationalism_texticon\n\n\n\n\n\n§8국수주의§!는 20세기 초에 들어 유행하기 시작한, 국가의 권위를 최고로 두는 민족주의적이고 권위주의적인 이념입니다. 개인보다는 국가와 민족의 단결을 강조하며, 전체 사회가 하나의 유기체처럼 움직여야 한다고 봅니다. 이는 다른 나라나 민족을 배척하는 극단적인 태도나 경향을 불러일으키며, 애국심을 가장해 개인의 이익과 국가의 이익이 충돌할 때 국가의 이익만을 우선 선택하도록 만듭니다.\n\n이들은 대부분의 경우 우상화된 지도자를 중심으로 한 독재를 지향하고, 정치적 반대파에 대한 무자비한 탄압, 언론과 집회의 자유 제한, 군사력 강화 등을 특징으로 합니다. 사회 질서와 국가의 위신을 세우기 위해 폭력과 선전이 적극 활용되었고, 국가의 확장을 위한 전쟁을 정당화합니다.\n\n독일의 §8국가사회주의§!, 이탈리아의 §8파시즘§!, 한국의 §8군국주의§!를 대표적인 예로 들 수 있습니다."
 xunzheng:0 "삼민주의"
 xunzheng_desc:0 "\n\n£GFX_kuomintang_texticon\n\n\n\n\n\n§8삼민주의§!는 쑨원이 발표한 초기 중화민국 정치 강령으로, 민족주의, 민권주의, 민생주의를 뜻합니다. 동양의 유교 등 민본주의 전통을 바탕으로 서양의 근대 정치사상을 도입한 것으로, 민족, 정치, 사회적 자유와 평등을 주장하는 이론입니다. 이에는 전통적인 황제 중심의 중화 질서에서 벗어나, 국민을 중심에 둔 새로운 공화정 국가를 수립하려는 시도가 담겨 있습니다.\n\n첫 번째 원칙인 §8민족주의§!는 외세의 간섭을 배격하고 자주적인 민족 국가를 수립하는 데 중점을 두는 사상입니다. 이는 단순한 민족주의나 국수주의의 형태와는 다르며, 중국 대륙의 다민족 사회 내의 평등과 통합을 중시해야 한다는 명분을 내세웁니다. 두 번째 원칙인 §8민권주의§!는 국민 주권, 즉 정치적 권리를 국민에게 부여하는 것을 핵심으로 하며, 입헌주의 실현과 민주정 수립을 통해 결과적으로 민중이 정치에 참여할 수 있어야 한다는 사상입니다. 세 번째 원칙인 §8민생주의§!는 경제적 평등과 사회적 복지를 강조하며, 토지 개혁이나 빈곤 문제 해결과 같은 정책을 통해 국민 생활의 안정과 향상을 도모하는 사상입니다."
