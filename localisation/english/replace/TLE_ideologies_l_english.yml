l_english:
 showaism:0 "쇼와 신정"
 showaism_desc:0 "\n\n£GFX_showaism_texticon\n\n\n\n\n\n§8쇼와 신정§! 체제 아래 쇼와 텐노와 대정익찬회는 천황이라는 강력한 전제 군주 치하에서 국가 개조를 행하고자 합니다. 천황은 단순 국가원수가 아니라 하늘의 뜻을 직접 받들어 열도와 그 백성들의 운명을 책임지고자 하는 현인신과도 같은 권위를 가집니다.\n\n이는 본질적으로 권위주의적인 전제정의 성격을 띄지만, 그 권위의 목적과 원천은 민의의 수렴과 반영에 있으며, 국가적 위기를 헤쳐나가기 위한 수단으로써 활용되기 위함입니다. 천황을 중심으로 한 정치 권력은 결국 국가의 존망이 개인의 역량과 재량에 달려 있다는 것을 의미함과 동시에 그가 전국적인 신뢰를 받고 있다는 증거이기도 합니다.\n\n때문에 이른바 쇼와 신정 체제는 천황이 사망한다거나 하는 사건에 대비하여 장기간 존속하기 어렵습니다. 이 권위는 시대의 흐름에 따라 점차 쇠퇴하고 또 해체될 것이며, 다른 정치 체제가 자리를 잡게 될 것입니다."
 showa_democracy:0 "쇼와 신정"
 showa_democracy_desc:0 "\n\n£GFX_showaism_texticon\n\n\n\n\n\n§8쇼와 신정§! 체제 아래 쇼와 텐노와 대정익찬회는 천황이라는 강력한 전제 군주 치하에서 국가 개조를 행하고자 합니다. 천황은 단순 국가원수가 아니라 하늘의 뜻을 직접 받들어 열도와 그 백성들의 운명을 책임지고자 하는 현인신과도 같은 권위를 가집니다.\n\n이는 본질적으로 권위주의적인 전제정의 성격을 띄지만, 그 권위의 목적과 원천은 민의의 수렴과 반영에 있으며, 국가적 위기를 헤쳐나가기 위한 수단으로써 활용되기 위함입니다. 천황을 중심으로 한 정치 권력은 결국 국가의 존망이 개인의 역량과 재량에 달려 있다는 것을 의미함과 동시에 그가 전국적인 신뢰를 받고 있다는 증거이기도 합니다.\n\n때문에 이른바 쇼와 신정 체제는 천황이 사망한다거나 하는 사건에 대비하여 장기간 존속하기 어렵습니다. 이 권위는 시대의 흐름에 따라 점차 쇠퇴하고 또 해체될 것이며, 다른 정치 체제가 자리를 잡게 될 것입니다."
 showa_communism:0 "쇼와 신정"
