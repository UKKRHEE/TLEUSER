 BOOKMARK_SIAM_INFO: "§Y제국주의의 광활한 영지 사이에서§!"
 BOOKMARK_SIAM_INFO_DELAYED: "§g§CTHE LAST EMPIRE: SOUTHERN EXPANSION§!의 컨텐츠\n§W--------------§!\n§W0.2.1§! §R나상 Vol.1§! 업데이트에서 통합\n§Y- 1945년까지의 컨텐츠\n- 동남아 지역 연계 스켈레톤 컨텐츠§!§!\n§W--------------§!\n\n£GFX_texticon_southasia\n\n\n\n\n\n§L서쪽에서 찾아온 제국주의의 거센 물결이 도달한 이후로, 이 지역의 대부분은 열강들에 의해 지배되거나, 적어도 막대한 영향력 아래 놓여 왔습니다. 시암 왕국은 따지자면 이 지역의 수많은 피착취자들 중 하나라고 이를 수 있는 국가입니다. 그러나 국체의 존립 여부는 오래된 왕국에 있어 그 이웃들과의 크나큰 차이점을 불러왔습니다.\n\n그들은 제 살을 깎아먹는 노력을 통해 그들의 자주권을 지켜내었으며, 원시적이라고 불리우던 거리에 불을 밝히고, 황량하던 평야에 철도를 깔았으며 나날히 증산되는 곡물들을 차오프라야의 강물과 함께 흘려보냈습니다. 유럽의 열강들은 이곳이 완충지대로써 가치가 있다는 점을 인정했으며, 시암인들은 메콩강의 영토를 대가로 하여 간신히 식민지 신세를 피할 수 있었습니다. 그들은 착잡한 심정으로 이웃한 경쟁국이였던 버마인들이 대영제국의 손아귀 안에 들어가는 것을 가만히 앉아서 지켜보았습니다.\n\n그러나, 시대가 바뀌고 있습니다. 전운이 감도는 유럽은 너무 멀고, 팽창하는 제국과는 너무나도 가깝습니다. 식민통치의 모든 것이 이제 한계에 도달하고 있습니다. 아무도 변화가 찾아오리라고는 생각치 못하지만, 불가피하게 찾아 올 것입니다. 이 불안정한 질서가 언제까지 유지될 수 있을까요?\n\n§Y버마를 두려워하라. 대부분의 사람들은 그 나라가 한 때 시암이었고 지금은 타이가 되었는지, 또는 현재 말레이시아의 일부가 되었으며 스리랑카라고 불리어야 하는지와 같은 일들을 잘 기억하지 못하기 때문이다.\n\n- 알렉산더 코번§!§!"
 
