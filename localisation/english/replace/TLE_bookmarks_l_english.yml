l_english:
 KOREA_GATHERING_STORM_DESC:0 "대규모 금융공황과 을축대홍수로 서막을 알린 강명 시대는 1929년의 미국에서 찾아온 경제 대공황과 함께 본격적인 궤도 위로 오르게 되었습니다. 이를 막기 위한 강명경장은 큰 효과를 보지 못하였습니다.\n\n국가 경기의 침체와 함께 찾아온 것은 급진적인 이념이었습니다. 정치적 불안정과 함께 외부에서의 도전도 하나 둘 찾아오고 있습니다.\n\n말 위에서 천하를 얻을 수는 있어도 말 위에서 천하를 다스릴 수 없다 하였습니다. 수성을 가하는 것에는 끊임없는 관심과 힘겨운 노력이 요할 것입니다."
 GATHERING_STORM_NAME:0 "시대의 종말"
 GATHERING_STORM_DESC:0 "찬란하고 아름다웠으나, 잔혹하고 끔찍하였던 그 좋았던 시절(Belle Epoque)은 두 발의 총성과 함께 화염으로 사그라들었습니다. 모든 이들이 함성을 지르며 다시 흙으로 되돌아갈 때, 비겁하고, 비열하며, 비참하게 살아남은 이들은 다시금 눈 앞에 서 있는 이들을 향해 총구를 돌리고 있습니다. \n아들과 아버지를 위해, 남편과 가족을 위해, 그리고 헛되이 죽어간 모든 이들을 위해. 피를 보았음에도 또 다시 피를 보기 위해 내달려 나아가며, 결국 모든 것의 종말로, 시대의 종말로 향하고 있습니다."
 
 SOV_GATHERING_STORM_DESC:0 "적백내전 이후 한때 러시아 제국이었던 이 땅에는 공산주의라 불리우는 새로운 종교, 서기장이라 불리우는 새로운 황제가 자리를 잡았고 그와 함께 인류 역사상 최대의 실험적 국가인 소비에트 사회주의 공화국 연방이 등장하였습니다. 소련은 막대한 인명 손실을 대가로 급속한 산업화와 집산화를 이룩해냈습니다.\n\n그들은 또 다시 일어선 서방의 독일과 날이 갈수록 호전적이게 되어 가는 동방의 한국이라는 새로운 위협에 직면하고 있습니다. 당연하게도 연방 공산당 내 권력을 둘러싼 내부의 갈등 또한 간과할 수 없습니다.." 
 
 DKG_GATHERING_STORM_DESC:0 "마지막 쇼군이자 최초의 통령 토쿠가와 요시노부가 마련한 체제는 그의 아들 요시히사가 동생 아키타케와 한 차례 권력 투쟁을 벌이면서 불안정함을 드러냈고, 외세의 침략으로 한 차례 잿더미가 된 땅에서 겨우 일궈낸 부와 영예는 관동대지진과 정묘공황으로 사상누각에 불과함을 깨닫게 하였습니다. \n\n요시히사 통령이 하나 둘 정적을 제거하고 국난을 수습하는데 여념이 없게 되면서 유신의 구호가 서서히 수면 위로 부상하고 있습니다.\n\n져야할 때를 알았을 때 비로소 세상 속에서 꽃들도 꽃이 되고, 사람도 사람이 되리라."
 
 ZLC_GATHERING_STORM_DESC:0 "국민당의 북벌을 막아낸 이후, 북경정부는 짧은 안정기에 접어들었습니다. 남중국에서의 통제권을 상실한 대신 화북에서의 확고한 행정망을 구축하였으며, 이후에는 대호황기를 맞이하여 국제적 영항력 또한 강화되었습니다.\n\n그러나 우페이푸와 차오쿤 사이의 권력 갈등은 더욱 심해지고 있으며 화남의 국민당과 오성연군 등 군벌들은 여전히 각자의 지배권을 구축하고 북경정부를 위협하고 있습니다. 동방에서는 한국 제국주의가 관내를 눈여겨보는 중입니다.\n\n중화민국 정통정부의 생존을 위해서는 반짝이는 두뇌가 필요할 것입니다."
 
 CHI_GATHERING_STORM_DESC:0 "오랜 세월 동안 정세는 국민당의 편이 아니었습니다. 북벌의 처참한 실패 이후 찾아온 일시적인 경제 붕괴와 행정력 상실, 그리고 국민당 세력의 약화는 삼민주의와 국민혁명의 가치와 현실성에 대한 의문을 제기했습니다.\n\n광동성에 갇힌 채 좌절하던 국민당 내 좌우파의 대립은 극에 달하였으며 결국 좌익이 국민당을 장악하고 우익이 대거 이탈하는 결과를 불러오게 되었습니다.\n\n그러나 왕징웨이 주석과 장제스 총사령관의 지도는 이러한 위기를 극복하기에 충분하였습니다. 대안경제정책과 황푸군관학교의 수립, 더불어 그 사상의 친우들은 국민당에게 다시 한번 주사위를 굴릴 기회를 제공했습니다."
 
 AST_GATHERING_STORM_DESC:0 "수만 년 전부터 아프로아시아의 주류 문명들과 고립된 채 남아있던 미지의 대륙, 오스트레일리아는 유럽인들에 의해 발견된 지 불과 수백 년도 안 되어 대영제국의 모범 식민지가 되었습니다. 호주인들은 대전쟁의 역사에서도 피로써 한 자리를 차지했습니다.\n\n그러나 이번에는 사정이 다릅니다. 그들의 적은 지난번 전쟁에 비해 너무 가까이 있고, 지구 반대편에 있는 역사상 가장 거대한 해상 제국의 중심은 여전히 이곳의 청년들이 유럽과 북아프리카에서 죽기를 원합니다."
 
 PHI_GATHERING_STORM_DESC:0 "그 유명한 페르디난드 마젤란의 세계 일주 대항해가 이곳에서 끝났습니다. 필리핀은 이후 스페인의 식민지가 되었으나, 한 차례 주인이 바뀌어 미국의 것이 되었습니다.\n\n그러나 미국인이 건국 이래 신봉하는 자유와 인권이란 전염병은 이 불쌍한 제도를 그냥 식민지로 둘 수 없었던 것으로 보입니다. 그들은 필리핀을 자치령으로 승격시켜 자체적인 정부를 구성케 하고 곧 독립시켜 주겠다는 약속을 했습니다.\n\n이에 관해서는 논란이 있을 수 있겠지만, 적어도 미국인들이 스스로를 침략자가 아닌 민주주의 구원자로 규정하고 있음은 의심할 바가 없습니다."
 
 MSR_GATHERING_STORM_DESC:0 "러시아 혁명 이후 일련적으로 일어난 소련의 수립과 한국의 시베리아 출병은 1920년대의 몽골을 뒤집어놓았습니다. 쉬수정의 중화민국 북방군이 통치하던 몽골을 뒤엎기 위해 소련이 지원한 사회주의자들이 조직적인 군사 반란을 일으키며 초원은 전장으로 변하였습니다.\n\n소련-한국 관계가 외교적 성과를 보였음에도 몽골에서의 내전은 계속되고 있으며, 종주권을 유지하기 위해 줄타기를 해야 할 처지에 놓인 중화민국 북경정부와 몽골에서의 고립을 자처한 쉬수정 군벌에게 이는 큰 위기가 되었습니다."
 
 MON_GATHERING_STORM_DESC:0 "러시아 혁명 이후 일련적으로 발생한 공화국 연방의 수립과 한국의 시베리아 출병 등의 사건들은 1920년대의 몽골을 뒤집어놓았습니다. 소련이 지원한 사회주의자들이 쉬수정의 북방군이 통치하던 몽골을 뒤엎기 위해 조직적인 군사 반란을 일으키면서 초원은 전장으로 변하였습니다.\n\n시간이 지나며 소련-한국 관계가 외교적 성과를 보였음에도 몽골에서의 내전은 계속되고 있습니다. 종주권을 유지하기 위해 줄타기를 해야 할 처지에 놓인 북경정부와 몽골에서의 고립을 자처한 쉬수정에게 이는 큰 위기가 되었으며, 영향권의 확장을 노리는 어느 제국에게는 중대한 기회가 되었습니다."
 
 SIK_GATHERING_STORM_DESC:0 "성스차이는 여러 가지 면에서 여타 군벌들과는 조금 다른 사람입니다. 1933년 위구르족의 반란과 군벌 내부에서의 쿠데타가 발생하면서 신강성은 혼란에 빠졌습니다. 이를 기회로 본 성스차이는 위구르족과 협상하고 소련의 지원을 받아 부대를 이끌고 쿠테타군을 몰아낸 다음 신강성의 지배자로 등극했습니다.\n\n신강 전역에는 스탈린의 초상화가 걸렸고 붉은 군대가 주둔했지만, 아직 신강성은 중화민국의 영토입니다. 위구르족과 협상한 이후 성스차이는 일부 현지 지도자들을 정부에 등용했지만, 머지 않아 모두 숙청했습니다. 이런 만큼 중원에서의 혼란이 계속되는 한 이곳에서의 혼란 또한 계속될 것입니다."
 
 GXC_GATHERING_STORM_DESC:0 "북벌의 실패 이후 광동성을 발판으로 삼아 국민당을 진정한 혁명 정당으로 만들려던 개조파의 시도는 성공적이었지만, 그렇다고 국민당의 강경 우파들을 모두 당내로 봉합할 수는 없었습니다. 그 중 대부분이 이곳 광서성에 있습니다.\n\n리쭝런과 그의 동조자들은 광동의 국민정부가 공산당에 잠식당한 가짜라고 주장하면서, 그들 스스로를 쑨원 선생과 국민당, 그리고 국민혁명의 진정한 후예라고 믿습니다.\n\n그러나 아마도 그들의 믿음이 현실로 이루어지는 일은 없을 것입니다." 
 
 PAR_GATHERING_STORM_DESC:0 "소련의 혁명에서 영감을 받지 않는 국가는 없었을 것입니다. 남미에 동떨어진 파라과이는 그러한 국가 중 하나로, 이 땅은 현재 2월 혁명당이 장악하고 있습니다. 사회주의적인 정책을 실시하는데에는 주변국들의 많은 반발이 있을 것이고, 특히 브라질의 배불뚝이 지주들이 혐오할 것입니다."
 
 SIA_GATHERING_STORM_DESC:0 "시암은 동남아시아에서 유일하게 식민지화되지 않은 나라라는 이명으로 유명합니다. 본래 차크리 왕조, 또는 라따나꼬신 왕조가 지배하던 시암은 1932년 쿠데타가 일어남에 따라 전제군주정이 종식되고 최초의 헌법이 제정되어 입헌군주정 국가가 되었으며, 인민당이라는 빅 텐트 정당이 정권을 잡았습니다.\n\n그러나 군부가 정치의 많은 부분에 관여하고 있습니다. 과거의 동지들은 경쟁자가 되었습니다. 쁠랙 피분송크람의 주도 아래 파시즘의 그림자가 군부와 당 내부에서 힘을 키우고 있습니다. 프리디 파놈용은 그의 사회주의적 이상을 실현시키기 위해서 정치계의 이곳저곳을 전전하고 있습니다."
 
 TIB_GATHERING_STORM_DESC:0 "산과 고원으로 둘러싸인 나라, 티베트는 항상 인류 문명의 중심에서는 조금 떨어져 있는 편이었고, 특히 현대에는 더욱 그렇습니다. 역설적이게도 그들의 고립성은 어쩌면 장점이라 볼 수 있습니다. 티베트의 집들과 사원들은 현대 전쟁의 불길과는 거리가 멀었습니다. 티베트는 말 그대로 부처의 지상 낙원이라고도 할 수 있을 것입니다.\n\n그러나 이들은 평화로움을 즐김과 동시에 티베트 고원의 높은 산봉우리 너머 밝은 태양이 일출하는 모습을 가만히 지켜다보면서 동방의 중국이나 남방의 영국, 어쩌면 또 다른 강한 나라가 그들을 압박해올 것을 두려워합니다. 상황이 언제 어떻게 변하게 될지는 또 모르는 일이니 말입니다."
 
 news.67.t:0 "제12회 올림픽"
 news.67.d:0 "제12회 올림픽이 대한제국 한성에서 개최되었습니다. 국제적 긴장이 심화됨에 따라, 많은 사람들은 올림픽이 취소될 것이라 생각했지만, 이번엔 그러지 않았습니다.\n\n한성은 올림픽을 주최하게 된 최초의 비서구권 도시로서, 연료 보급 없이 독일에서부터 올림픽 성화를 받기 위해 Me 261 장거리 비행기를 특별히 만들었습니다.\n\n한국 선수들의 기량은 뛰어났으며, 한국은 독일과 미합중국의 뒤를 이어 14개의 금메달을 획득해, 메달 집계수 3위를 등극하였습니다."
 news.68.d:0 "제12회 올림픽이 최근 핀란드의 헬싱키에서 개최되었습니다.\n\n올림픽은 원래 한성에서 개최되기로 하였으나, 대한제국이 전쟁에 주력함으로서 불가능해졌고 국제 올림픽 위원회는 대신 헬싱키에서 대회를 개최하기로 했습니다.\n\n미합중국의 선수들이 가장 많은 메달을 수상했고, 독일과 이탈리아가 그 뒤를 이었습니다. 핀란드는 10개의 금메달을 획득하여 4위에 올랐습니다."
 
 BOOKMARK_UGLY_AMERICAN_NEW_KOR:0 "§Y공영권§!"
 BOOKMARK_UGLY_AMERICAN_NEW_DELAYED_KOR:0 "§Y"우리 민족은 동아의 선도민족으로, 고통에 시름하는 황인들을 계몽해야 할 의무가 있다." §!§g-이강§!\n\n£GFX_faction_daitoakyoeiken\n\n\n\n\n§g대동아공영권은 대동아의 사람들이 공동으로 번영하는 권역이라는 뜻으로, 대한제국의 영토 확장 정책이자 프로파간다 구호입니다. '아시아 민족이 서양 세력의 식민지배로부터 해방되려면 대한을 중심으로 대동아공영권을 결성하여 서양 세력을 몰아내야 한다'며 1940년 8월 1일 한국 정부와 소련 정부의 담화에서 처음 등장한 개념입니다.§!"
 BOOKMARK_UGLY_AMERICAN_NEW_GER:0 "§L추축국§!"
 BOOKMARK_UGLY_AMERICAN_NEW_DELAYED_GER:0 "§L"삶은 나약함을 용서하지 않는다" §!§g-아돌프 히틀러§!\n\n£GFX_faction_axis\n\n\n\n\n§g추축국 혹은 로마-베를린 추축은 제2차 세계 대전에서 연합국에 대항하여 싸운 군사 연합체입니다. 추축국은 연합국에 대한 반대에는 동의했지만, 활동을 완전히 조정하지는 못했습니다다. 추축국은 1930년대 중반 나치 독일, 이탈리아 왕국, 대한제국 등의 외교적 노력으로 성장하였습니다.§!"
 BOOKMARK_UGLY_AMERICAN_NEW_SOV:0 "§R코민테른§!"
 BOOKMARK_UGLY_AMERICAN_NEW_DELAYED_SOV:0 "§R"국가가 존재하는 동안에는 자유가 있을 수 없다. 자유가 있으면 국가는 없을 것이다." §!§g-블라디미르 레닌§!\n\n£GFX_faction_commintern\n\n\n\n\n§g공산주의 인터내셔널, 코민테른 또는 제3인터내셔널은 세계 각국 공산당 및 대표적 공산주의 단체의 연합체이자 지도 조직으로 공산주의 인터내셔널(Communist International)의 약칭입니다. 1919년 3월 소련 공산당의 혁명가들이 설립하여, 이 조직의 지도자였던 이오시프 스탈린에 의해 1943년 5월에 코민포름으로 대체되었습니다.§!"
 BOOKMARK_UGLY_AMERICAN_NEW_USA:0 "§C연합국§!"
 BOOKMARK_UGLY_AMERICAN_NEW_DELAYED_USA:0 "§C"나에게 할 수 없다는 말은 하지 마시오." §!§g-프랭클린 루즈벨트§!\n\n£GFX_faction_allies\n\n\n\n\n§g연합국은 제2차 세계 대전 기간 당시 독일국, 대한제국, 이탈리아 왕국을 주축으로 한 추축국에 대항하기 위해 결성된 국제적인 군사 연합체입니다. 1942년 이후로는 공식적으로 유엔이라고 불렀습니다.§!"
 
